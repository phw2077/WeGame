<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的小游戏乐园</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        .header {
            background-color: #2c3e50;
            color: white;
            width: 100%;
            text-align: center;
            padding: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 2px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 90%;
            max-width: 400px;
        }

        .game-card {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-card:hover, .game-card:active {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .game-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .game-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .game-desc {
            font-size: 14px;
            color: #7f8c8d;
        }

        .footer {
            margin-top: auto;
            padding: 20px;
            color: #95a5a6;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎮 我的小游戏乐园 🎮</h1>
    </div>

    <div class="game-container">
        <!-- 贪吃蛇入口 -->
        <a href="snake.html" class="game-card">
            <div class="game-icon">🐍</div>
            <div class="game-title">经典贪吃蛇</div>
            <div class="game-desc">支持键盘与屏幕虚拟按键，随时随地开吃！</div>
        </a>

        <!-- 拼图入口 -->
        <a href="puzzle.html" class="game-card">
            <div class="game-icon">🧩</div>
            <div class="game-title">数字滑动拼图</div>
            <div class="game-desc">经典的 3x3 智力挑战，点击移动数字块。</div>
        </a>
        <!-- 记忆翻牌入口 -->
        <a href="memory.html" class="game-card">
            <div class="game-icon">🃏</div>
            <div class="game-title">记忆翻牌</div>
            <div class="game-desc">考验记忆力！翻开相同的卡片进行消除。</div>
        </a>

        <!-- 2048入口 -->
        <a href="2048.html" class="game-card">
            <div class="game-icon">🔢</div>
            <div class="game-title">经典 2048</div>
            <div class="game-desc">滑动合并数字，挑战最高分！(支持手机滑动)</div>
        </a>

        <!-- 扫雷入口 -->
        <a href="minesweeper.html" class="game-card">
            <div class="game-icon">💣</div>
            <div class="game-title">复古扫雷</div>
            <div class="game-desc">经典 Windows 扫雷。(手机长按插旗)</div>
        </a>

        <!-- 数独入口 -->
        <a href="sudoku.html" class="game-card">
            <div class="game-icon">📝</div>
            <div class="game-title">经典数独</div>
            <div class="game-desc">锻炼大脑逻辑，三种难度可选！</div>
        </a>
    </div>

    <div class="footer">
        Powered by GitHub Pages & Trae IDE
    </div>

</body>
</html>
