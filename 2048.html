<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #faf8ef;
            color: #776e65;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            width: 300px;
            margin-bottom: 20px;
            align-items: center;
        }
        h1 { margin: 0; font-size: 40px; }
        .score-container {
            background: #bbada0;
            padding: 5px 15px;
            border-radius: 3px;
            color: white;
            font-weight: bold;
            text-align: center;
        }
        
        .grid-container {
            background-color: #bbada0;
            padding: 10px;
            border-radius: 6px;
            display: grid;
            grid-template-columns: repeat(4, 65px);
            grid-template-rows: repeat(4, 65px);
            gap: 10px;
            position: relative;
            touch-action: none; /* 防止手机端滑动屏幕 */
        }
        
        .grid-cell {
            background-color: rgba(238, 228, 218, 0.35);
            border-radius: 3px;
        }
        
        .tile {
            position: absolute;
            width: 65px;
            height: 65px;
            background-color: #eee4da;
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            transition: all 0.15s ease-in-out;
        }
        
        /* 根据数值设置不同颜色 */
        .tile[data-val="2"] { background: #eee4da; color: #776e65; }
        .tile[data-val="4"] { background: #ede0c8; color: #776e65; }
        .tile[data-val="8"] { background: #f2b179; color: #f9f6f2; }
        .tile[data-val="16"] { background: #f59563; color: #f9f6f2; }
        .tile[data-val="32"] { background: #f67c5f; color: #f9f6f2; }
        .tile[data-val="64"] { background: #f65e3b; color: #f9f6f2; }
        .tile[data-val="128"] { background: #edcf72; color: #f9f6f2; font-size: 24px; }
        .tile[data-val="256"] { background: #edcc61; color: #f9f6f2; font-size: 24px; }
        .tile[data-val="512"] { background: #edc850; color: #f9f6f2; font-size: 24px; }
        .tile[data-val="1024"] { background: #edc53f; color: #f9f6f2; font-size: 20px; }
        .tile[data-val="2048"] { background: #edc22e; color: #f9f6f2; font-size: 20px; }
        
        .home-btn {
            margin-top: 30px;
            color: #776e65;
            text-decoration: none;
            font-weight: bold;
        }
        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #a39b94;
            text-align: center;
            width: 300px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>2048</h1>
        <div class="score-container">分数<br><span id="score">0</span></div>
    </div>
    
    <div class="grid-container" id="grid">
        <!-- 16个背景底格 -->
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    </div>
    
    <div class="instructions">电脑使用 ⬆️ ⬇️ ⬅️ ➡️，手机在方块区滑动。</div>
    <a href="index.html" class="home-btn">⬅️ 返回主页</a>

    <script>
        const grid = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        let board = Array(4).fill().map(() => Array(4).fill(0));
        let score = 0;

        function init() {
            addRandomTile();
            addRandomTile();
            render();
        }

        function addRandomTile() {
            let emptyCells = [];
            for(let r=0; r<4; r++) {
                for(let c=0; c<4; c++) {
                    if(board[r][c] === 0) emptyCells.push({r, c});
                }
            }
            if(emptyCells.length > 0) {
                let randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[randomCell.r][randomCell.c] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function render() {
            // 清除旧的 tile（保留底格）
            document.querySelectorAll('.tile').forEach(t => t.remove());
            scoreEl.innerText = score;

            for(let r=0; r<4; r++) {
                for(let c=0; c<4; c++) {
                    if(board[r][c] !== 0) {
                        let tile = document.createElement('div');
                        tile.classList.add('tile');
                        tile.dataset.val = board[r][c];
                        tile.innerText = board[r][c];
                        // 计算绝对定位 (padding 10 + 索引 * (宽度 65 + gap 10))
                        tile.style.top = `${10 + r * 75}px`;
                        tile.style.left = `${10 + c * 75}px`;
                        grid.appendChild(tile);
                    }
                }
            }
        }

        // 核心移动逻辑 (向左滑动为例，其他方向通过旋转矩阵实现)
        function slide(row) {
            let arr = row.filter(val => val); // 去除 0
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i+1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr.splice(i+1, 1);
                }
            }
            while (arr.length < 4) arr.push(0); // 补齐 0
            return arr;
        }

        function rotateRight(matrix) {
            let result = [];
            for (let i = 0; i < 4; i++) {
                result.push([matrix[3][i], matrix[2][i], matrix[1][i], matrix[0][i]]);
            }
            return result;
        }
        function rotateLeft(matrix) {
            return rotateRight(rotateRight(rotateRight(matrix)));
        }

        function move(dir) {
            let oldBoard = JSON.stringify(board);
            
            if (dir === 'Left') {
                for (let r=0; r<4; r++) board[r] = slide(board[r]);
            } else if (dir === 'Right') {
                for (let r=0; r<4; r++) board[r] = slide(board[r].reverse()).reverse();
            } else if (dir === 'Up') {
                board = rotateLeft(board);
                for (let r=0; r<4; r++) board[r] = slide(board[r]);
                board = rotateRight(board);
            } else if (dir === 'Down') {
                board = rotateRight(board);
                for (let r=0; r<4; r++) board[r] = slide(board[r]);
                board = rotateLeft(board);
            }

            if (oldBoard !== JSON.stringify(board)) {
                addRandomTile();
                render();
            }
        }

        // 键盘事件
        document.addEventListener('keydown', e => {
            if(e.key.includes('Arrow')) {
                e.preventDefault();
                move(e.key.replace('Arrow', ''));
            }
        });

        // 手机滑动事件
        let touchStartX = 0, touchStartY = 0;
        grid.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: false});

        grid.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
                move(dx > 0 ? 'Right' : 'Left');
            } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 30) {
                move(dy > 0 ? 'Down' : 'Up');
            }
        }, {passive: false});

        init();
    </script>
</body>
</html>
